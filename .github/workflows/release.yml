name: Release

# Pousser un tag vX.Y.Z construit la carte et publie une release GitHub
# avec dist/blueprint3d-card.js en pièce jointe (c'est ce que HACS télécharge).
# Le build tourne sans droit d'écriture ; seul le job publish, qui n'exécute
# aucun code npm, a le droit de créer la release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifie que le tag est sur main et correspond à la version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag hors de main"; exit 1; }
          v="${TAG#v}"
          grep -qF "\"version\": \"$v\"" package.json || { echo "package.json n'est pas en $v"; exit 1; }
          grep -qF "const VERSION = \"$v\"" src/blueprint3d-card.ts || { echo "VERSION n'est pas en $v"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card
          path: dist/blueprint3d-card.js
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: card
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" blueprint3d-card.js --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
